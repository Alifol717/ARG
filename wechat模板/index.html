<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信列表</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f3f3f3;
            height: 100vh;
            overflow: hidden;
        }
        /* 微信页面主体 */
        .wechat-container {
            height: 100vh;
            background: #f3f3f3;
        }
        /* 微信头部 */
        .wechat-header {
            background: #f3f3f3;
            padding: 12px 16px;
        }
        .wechat-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .wechat-title {
            font-size: 22px;
            font-weight: 500;
        }
        .header-icon-group {
            display: flex;
            gap: 20px;
            font-size: 18px;
        }
        .search-input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            background: #fff;
            font-size: 14px;
        }
        /* 聊天列表 */
        .chat-list {
            background: #fff;
        }
        .chat-item {
            display: flex;
            padding: 12px 16px;
            gap: 12px;
            border-bottom: 1px solid #eee;
            position: relative;
            cursor: pointer; /* 鼠标悬浮变手型，提示可点击 */
        }
        .chat-item:active {
            background-color: #eeeeee;
        }
        .chat-avatar {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            background: #999;
            flex-shrink: 0;
            overflow: hidden;
        }
        .chat-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .chat-info {
            flex: 1;
        }
        .chat-name-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .chat-name {
            font-size: 16px;
            font-weight: 500;
        }
        .chat-time {
            font-size: 12px;
            color: #999;
        }
        .chat-desc {
            font-size: 14px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* 未读红点 */
        .unread-badge {
            position: absolute;
            left: 42px;
            top: 8px;
            background: #f43f3b;
            color: #fff;
            font-size: 11px;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* 底部微信Tab栏 */
        .wechat-tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55px;
            background: #fff;
            display: flex;
            border-top: 1px solid #eee;
        }
        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 12px;
            gap: 4px;
        }
        .tab-item.active {
            color: #07c160;
        }
        .tab-icon {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="wechat-container">
        <div class="wechat-header">
            <div class="wechat-title-row">
                <div class="wechat-title">微信 ∨</div>
                <div class="header-icon-group">
                    <span>🔍</span>
                    <span>+</span>
                </div>
            </div>
            <input class="search-input" placeholder="搜索">
        </div>

        <!-- 聊天列表：点击跳转，通过参数区分好友 id -->
        <div class="chat-list">
            <!-- 陈默 id=chenmo -->
            <div class="chat-item" onclick="location.href='chat.html?uid=chenmo'">
                <div class="chat-avatar">
                    <img src="https://picsum.photos/id/64/48/48" alt="头像">
                </div>
                <div class="chat-info">
                    <div class="chat-name-row">
                        <div class="chat-name">陈默</div>
                        <div class="chat-time">14:55</div>
                    </div>
                    <div class="chat-desc">明天见</div>
                </div>
            </div>
            <!--  我id=linxia -->
            <div class="chat-item" onclick="location.href='chat.html?uid=linxia'">
                <div class="chat-avatar">
                    <img src="https://picsum.photos/id/1005/48/48" alt="头像">
                </div>
                <div class="chat-info">
                    <div class="chat-name-row">
                        <div class="chat-name">我</div>
                        <div class="chat-time">14:30</div>
                    </div>
                    <div class="chat-desc">[图片]</div>
                </div>
            </div>
            <!-- 公众号 id=police -->
            <div class="chat-item" onclick="location.href='chat.html?uid=police'">
                <div class="chat-avatar">
                    <img src="https://picsum.photos/id/1074/48/48" alt="头像">
                </div>
                <div class="chat-info">
                    <div class="chat-name-row">
                        <div class="chat-name">公众号</div>
                        <div class="chat-time">13:00</div>
                    </div>
                    <div class="chat-desc">aaaa</div>
                </div>
            </div>
        </div>

        <div class="wechat-tab-bar">
            <div class="tab-item active">
                <div class="tab-icon">💬</div>
                <span>微信</span>
            </div>
            <div class="tab-item">
                <div class="tab-icon">👥</div>
                <span>通讯录</span>
            </div>
            <div class="tab-item">
                <div class="tab-icon">🔍</div>
                <span>发现</span>
            </div>
            <div class="tab-item">
                <div class="tab-icon">👤</div>
                <span>我</span>
            </div>
        </div>
    </div>
</body>
</html>
