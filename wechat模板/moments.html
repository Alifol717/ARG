<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朋友圈</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
        }
        body {
            background: #f0f0f0;
            min-height:100vh;
        }
        /* 顶部返回栏 */
        .moments-top {
            height:48px;
            background:#f0f0f0;
            display:flex;
            align-items:center;
            padding:0 12px;
            position:sticky;
            top:0;
            z-index:99;
        }
        .back {
            font-size:22px;
            cursor:pointer;
        }
        .moments-title {
            flex:1;
            text-align:center;
            font-size:17px;
            font-weight:500;
        }
        /* 朋友圈封面区域 */
        .cover-box {
            width:100%;
            height:200px;
            background:#ddd;
            position:relative;
        }
        .cover-box img {
            width:100%;
            height:100%;
            object-fit:cover;
        }
        /* 底部头像昵称 */
        .user-info {
            background:#fff;
            display:flex;
            justify-content:flex-end;
            align-items:flex-end;
            padding:16px;
            gap:12px;
            margin-top:-50px;
            position:relative;
        }
        .moments-avatar {
            width:80px;
            height:80px;
            border:3px solid #fff;
            border-radius:4px;
            overflow:hidden;
        }
        .moments-avatar img {
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .moments-name {
            font-size:22px;
            font-weight:500;
            margin-bottom:8px;
        }
        /* 朋友圈动态列表 */
        .dynamic-list {
            margin-top:10px;
            background:#fff;
        }
        .dynamic-item {
            padding:16px;
            border-bottom:1px solid #eee;
        }
        .dynamic-text {
            font-size:15px;
            line-height:1.6;
            margin-bottom:10px;
        }
        .dynamic-time {
            font-size:12px;
            color:#999;
            margin-top:10px;
        }
        /* ========== 微信朋友圈多图九宫格核心样式 ========== */
        .img-group {
            display:grid;
            gap:6px;
        }
        /* 1张图：大图 */
        .img-group.count-1 {
            grid-template-columns: 1fr;
            max-width:240px;
        }
        /* 2/4张图：两列 */
        .img-group.count-2, .img-group.count-4 {
            grid-template-columns: repeat(2, 1fr);
            max-width:300px;
        }
        /* 3/5~9张图：三列九宫格 */
        .img-group.count-3, .img-group.count-9 {
            grid-template-columns: repeat(3, 1fr);
            max-width:360px;
        }
        .img-item {
            aspect-ratio: 1/1;
            overflow:hidden;
            border-radius:2px;
        }
        .img-item img {
            width:100%;
            height:100%;
            object-fit:cover;
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="moments-top">
        <div class="back" onclick="history.back()">&lt;</div>
        <div class="moments-title" id="momentsName"></div>
        <div style="width:24px"></div>
    </div>

    <!-- 朋友圈封面（可替换大图） -->
    <div class="cover-box">
        <img id="coverImg" src="">
    </div>

    <!-- 用户头像昵称 -->
    <div class="user-info">
        <div class="moments-avatar">
            <img id="avatarImg" src="">
        </div>
        <div>
            <div class="moments-name" id="userName"></div>
        </div>
    </div>

    <!-- 朋友圈动态内容 -->
    <div class="dynamic-list" id="dynamicWrap"></div>

<script>
    // ===== 朋友圈自定义数据（全部在这里修改，支持多图片数组） =====
    const momentsData = {
        chenmo: {
            name:"陈默",
            avatar:"https://picsum.photos/id/64/80/80",
            cover:"https://picsum.photos/id/1036/1080/400", // 朋友圈封面大图
            dynamics:[
                {
                    text:"你认识我吗？",
                    time:"昨天 18:22",
                    images: ["https://picsum.photos/id/1025/400/400"] // 单张图片
                },
                {
                    text:"深夜无眠，好多事想不通",
                    time:"3天前",
                    images: ["https://picsum.photos/id/1030/400/400","https://picsum.photos/id/1031/400/400"] // 两张图
                },
                {
                    text:"出门随手拍",
                    time:"一周前",
                    images: [
                        "https://picsum.photos/id/1040/400/400",
                        "https://picsum.photos/id/1041/400/400",
                        "https://picsum.photos/id/1042/400/400",
                        "https://picsum.photos/id/1043/400/400",
                        "https://picsum.photos/id/1044/400/400",
                        "https://picsum.photos/id/1045/400/400",
                        "https://picsum.photos/id/1046/400/400",
                        "https://picsum.photos/id/1047/400/400",
                        "https://picsum.photos/id/1048/400/400"
                    ] // 9张九宫格
                }
            ]
        },
        linxia: {
            name:"老同学 林夏",
            avatar:"https://picsum.photos/id/1005/80/80",
            cover:"https://picsum.photos/id/1039/1080/400",
            dynamics:[
                {
                    text:"岁岁平安，万事顺意",
                    time:"2天前",
                    images: ["https://picsum.photos/id/1060/400/400","https://picsum.photos/id/1061/400/400","https://picsum.photos/id/1062/400/400"]
                },
                {
                    text:"聚会合照留念",
                    time:"10天前",
                    images: ["https://picsum.photos/id/1070/400/400","https://picsum.photos/id/1071/400/400","https://picsum.photos/id/1072/400/400","https://picsum.photos/id/1073/400/400"]
                }
            ]
        },
        police: {
            name:"陈警官",
            avatar:"https://picsum.photos/id/1074/80/80",
            cover:"https://picsum.photos/id/1043/1080/400",
            dynamics:[
                {
                    text:"坚守岗位，守护一方平安",
                    time:"5天前",
                    images: ["https://picsum.photos/id/1080/400/400"]
                }
            ]
        }
    };

    // 获取页面uid参数
    const params = new URLSearchParams(location.search);
    const uid = params.get("uid");
    const data = momentsData[uid];

    // 渲染顶部、头像、封面、昵称
    document.getElementById("momentsName").innerText = data.name + "的朋友圈";
    document.getElementById("avatarImg").src = data.avatar;
    document.getElementById("coverImg").src = data.cover;
    document.getElementById("userName").innerText = data.name;

    // 循环渲染每条动态 + 自动生成多图九宫格
    let html = "";
    data.dynamics.forEach(item=>{
        // 自动判断图片数量，匹配对应布局class
        let imgCount = item.images.length;
        let gridClass = "";
        if(imgCount === 1) gridClass = "count-1";
        else if(imgCount === 2) gridClass = "count-2";
        else if(imgCount === 3) gridClass = "count-3";
        else if(imgCount === 4) gridClass = "count-4";
        else gridClass = "count-9"; // 5~9张统一三列九宫格

        // 拼接图片DOM
        let imgHtml = "";
        item.images.forEach(imgSrc=>{
            imgHtml += `<div class="img-item"><img src="${imgSrc}" /></div>`
        })

        // 完整单条动态
        html += `
        <div class="dynamic-item">
            <div class="dynamic-text">${item.text}</div>
            <div class="img-group ${gridClass}">
                ${imgHtml}
            </div>
            <div class="dynamic-time">${item.time}</div>
        </div>
        `
    })
    document.getElementById("dynamicWrap").innerHTML = html;
</script>
</body>
</html>
