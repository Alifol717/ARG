<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沉没的日记本</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        /* 先让body可见，解锁后再隐藏 */
        body {
            min-height: 100vh;
            padding: 40px 60px;
            color: #f0e8e8;
            background: rgba(0, 20, 30, 0.6);
            background-blend-mode: multiply;
            /* 默认可见，JS解锁后再展示完整背景 */
            display: block;
        }
        /* 页面内容容器，默认隐藏，密码正确再显示 */
        .page-wrap {
            display: none;
        }
        /* 弹窗遮罩全局样式，提前定义，避免JS动态样式失效 */
        #pwdOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
        }
        #pwdModal {
            width: 320px;
            padding: 28px 24px;
            background: rgba(20,30,40,0.75);
            backdrop-filter: blur(14px);
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        #pwdTitle {
            font-size: 20px;
            text-align: center;
            color: #fff;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        #pwdInput {
            width: 100%;
            padding: 11px 14px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            outline: none;
            margin-bottom: 20px;
        }
        #pwdInput::placeholder {
            color: #c0b8c8;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        .cancel-btn {
            padding: 9px 18px;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.15);
            color: #e0d8dc;
            font-size: 15px;
            cursor: pointer;
        }
        .confirm-btn {
            padding: 9px 18px;
            border: none;
            border-radius: 10px;
            background: #e8b0c0;
            color: #111;
            font-size: 15px;
            cursor: pointer;
        }

        /* 原有日记页面样式不变 */
        .page-header {
            text-align: center;
            margin-bottom: 50px;
            position: relative;
        }
        .page-header h1 {
            font-size: 48px;
            letter-spacing: 8px;
            color: #ffffff;
            font-weight: 500;
        }
        .decor-star {
            position: absolute;
            color: #e2d0d8;
            font-size: 20px;
        }
        .star-top { top: 0; left: 50%; transform: translateX(-50%); }
        .star-right { top: 30px; right: 40px; }
        .star-bottom { bottom: 10px; left: 10%; }

        .main-wrap {
            display: flex;
            gap: 40px;
        }
        .sidebar {
            width: 220px;
            flex-shrink: 0;
        }
        .user-card {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 24px 16px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 10, 15, 0.35);
            margin-bottom: 24px;
        }
        .moon-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #c2b0d0, #a0c0d8);
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 26px;
        }
        .user-name {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #fff;
        }
        .user-desc {
            font-size: 13px;
            color: #d8d0d4;
            margin-bottom: 16px;
        }
        .data-row {
            display: flex;
            justify-content: space-around;
        }
        .data-item span:first-child {
            display: block;
            font-size: 20px;
            color: #e8b0c8;
            font-weight: bold;
        }
        .data-item span:last-child {
            font-size: 12px;
            color: #e0d8dc;
        }
        .side-nav {
            background: rgba(255,255,255,0.12);
            border-radius: 14px;
            padding: 12px;
        }
        .nav-item {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            color: #f2ecf0;
        }
        .nav-item.active {
            background: rgba(255,255,255,0.25);
        }
        .category-title {
            margin: 16px 0 8px;
            font-size: 14px;
            padding: 0 10px;
            color: #d0c4cc;
            display: flex;
            justify-content: space-between;
        }
        .category-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 10px;
            font-size: 14px;
            color: #e8e0e4;
        }
        .content-area {
            flex: 1;
        }
        .content-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 20px;
        }
        .content-head h2 {
            font-size: 20px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
        }
        .search-input {
            padding: 8px 14px;
            border: none;
            border-radius: 20px;
            background: rgba(255,255,255,0.18);
            width: 220px;
            outline: none;
            color: #fff;
        }
        .search-input::placeholder{
            color:#d0c8ce;
        }
        .page-num {
            padding: 6px 12px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            font-size: 13px;
            color: #d0c8ce;
            flex-shrink: 0;
        }
        .diary-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 20px;
            display: flex;
            gap: 18px;
        }
        .diary-card.pink-border {
            border-left: 6px solid #e8b0c0;
        }
        .diary-card.blue-border {
            border-left: 6px solid #a8c0d8;
        }
        .diary-date {
            width: 60px;
            flex-shrink: 0;
            text-align: center;
        }
        .diary-date .day {
            font-size: 30px;
            font-weight: bold;
            color: #f0a8c0;
        }
        .diary-date .ym {
            font-size: 13px;
            color: #d8d0d4;
        }
        .diary-main {
            flex: 1;
        }
        .diary-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .diary-title {
            font-size: 20px;
            font-weight: 500;
            color: #ffffff;
        }
        .diary-text {
            font-size: 15px;
            color: #e8e0e4;
            line-height: 1.6;
            margin-bottom: 8px;
        }
        .enter-link {
            text-align: right;
            font-size: 14px;
            color: #f0b8cc;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<script>
// 密码（和你线索匹配 xiyu128）
const correctPwd = "20201135976";
// 获取DOM元素（页面已经提前写死弹窗，不会创建失败）
const overlay = document.getElementById("pwdOverlay");
const pwdInput = document.getElementById("pwdInput");
const confirmBtn = document.querySelector(".confirm-btn");
const cancelBtn = document.querySelector(".cancel-btn");
const pageWrap = document.querySelector(".page-wrap");

// 自动聚焦输入框
pwdInput.focus();

// 密码验证函数
function checkPwd() {
    const inputVal = pwdInput.value.trim();
    if(inputVal === correctPwd) {
        overlay.remove(); // 删除密码弹窗
        pageWrap.style.display = "block"; // 展示完整日记页面
        // 解锁后加载背景图（防止缺失图片阻塞白屏）
        document.body.style.backgroundImage = "url('./clock.jpg')";
    } else {
        alert("密码错误，请重新输入！");
        pwdInput.value = "";
        pwdInput.focus();
    }
}

// 绑定点击和回车事件
confirmBtn.addEventListener("click", checkPwd);
pwdInput.addEventListener("keydown", e => e.key === "Enter" && checkPwd());
// 取消按钮刷新页面，无法绕过
cancelBtn.addEventListener("click", () => location.reload());

// 搜索跳转逻辑
const keywordMap = {
    '日记': 'https://www.baidu.com',
    'note': 'https://www.baidu.com',
    'bing': 'https://www.bing.com',
    '微博': 'https://weibo.com',
    '维基': 'https://zh.wikipedia.org',
    '小红书': 'https://xiaohongshu.com'
};
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('keydown', function(e) {
    if(e.key === 'Enter'){
        let inputVal = this.value.trim().toLowerCase();
        if(keywordMap[inputVal]) window.open(keywordMap[inputVal], '_blank');
    }
})

// 日记链接跳转
document.querySelectorAll('.enter-link').forEach(item => {
    item.addEventListener('click', () => {
        const link = item.getAttribute('data-url');
        if(link) window.open(link, '_blank');
    })
})
</script>
