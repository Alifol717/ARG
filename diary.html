<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沉没的日记本</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            /* ========== 改动核心：替换为时钟水池背景图 ========== */
            background: url('./clock.jpg') center center / cover no-repeat fixed;
            min-height: 100vh;
            padding: 40px 60px;
            color: #f0e8e8;
            /* 叠加半透深色遮罩，防止背景太亮看不清文字 */
            background-color: rgba(0, 20, 30, 0.45);
            background-blend-mode: multiply;
        }

        /* 顶部标题区域 */
        .page-header {
            text-align: center;
            margin-bottom: 50px;
            position: relative;
        }
        .page-header h1 {
            font-size: 48px;
            letter-spacing: 8px;
            color: #ffffff;
            font-weight: 500;
        }
        .page-header p {
            margin-top: 10px;
            color: #d0c8ce;
            letter-spacing: 2px;
        }
        .decor-star {
            position: absolute;
            color: #e2d0d8;
            font-size: 20px;
        }
        .star-top { top: 0; left: 50%; transform: translateX(-50%); }
        .star-right { top: 30px; right: 40px; }
        .star-bottom { bottom: 10px; left: 10%; }

        /* 主体布局：侧边栏+内容区 */
        .main-wrap {
            display: flex;
            gap: 40px;
        }

        /* 左侧固定侧边栏 */
        .sidebar {
            width: 220px;
            flex-shrink: 0;
        }
        .user-card {
            /* 加深卡片透明度，适配深色背景 */
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 24px 16px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 10, 15, 0.35);
            margin-bottom: 24px;
            position: relative;
        }
        .moon-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #c2b0d0, #a0c0d8);
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 26px;
        }
        .user-name {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #fff;
        }
        .user-desc {
            font-size: 13px;
            color: #d8d0d4;
            margin-bottom: 16px;
        }
        .data-row {
            display: flex;
            justify-content: space-around;
        }
        .data-item span:first-child {
            display: block;
            font-size: 20px;
            color: #e8b0c8;
            font-weight: bold;
        }
        .data-item span:last-child {
            font-size: 12px;
            color: #e0d8dc;
        }

        /* 侧边导航菜单 */
        .side-nav {
            background: rgba(255,255,255,0.12);
            border-radius: 14px;
            padding: 12px;
        }
        .nav-item {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            color: #f2ecf0;
        }
        .nav-item.active {
            background: rgba(255,255,255,0.25);
            box-shadow: 0 2px 8px rgba(0, 15, 25, 0.3);
        }
        .category-title {
            margin: 16px 0 8px;
            font-size: 14px;
            padding: 0 10px;
            color: #d0c4cc;
            display: flex;
            justify-content: space-between;
        }
        .category-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 10px;
            font-size: 14px;
            color: #e8e0e4;
        }

        /* 右侧日记主内容区 */
        .content-area {
            flex: 1;
        }
        .content-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 20px;
        }
        .content-head h2 {
            font-size: 20px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
        }
        .search-input {
            padding: 8px 14px;
            border: none;
            border-radius: 20px;
            background: rgba(255,255,255,0.18);
            width: 220px;
            outline: none;
            color: #fff;
        }
        .search-input::placeholder{
            color:#d0c8ce;
        }
        /* 页码板块样式 小巧磨砂 统一风格 */
        .page-num {
            padding: 6px 12px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            font-size: 13px;
            color: #d0c8ce;
            flex-shrink: 0;
        }

        /* 日记卡片通用样式 */
        .diary-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 20px;
            display: flex;
            gap: 18px;
            box-shadow: 0 3px 12px rgba(0, 10, 18, 0.3);
        }
        .diary-card.pink-border {
            border-left: 6px solid #e8b0c0;
        }
        .diary-card.blue-border {
            border-left: 6px solid #a8c0d8;
        }
        .diary-date {
            width: 60px;
            flex-shrink: 0;
            text-align: center;
        }
        .diary-date .day {
            font-size: 30px;
            font-weight: bold;
            color: #f0a8c0;
        }
        .diary-date .ym {
            font-size: 13px;
            color: #d8d0d4;
        }
        .diary-main {
            flex: 1;
        }
        .diary-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .diary-title {
            font-size: 20px;
            font-weight: 500;
            color: #ffffff;
        }
        .diary-weather {
            font-size: 14px;
            color: #d8d0d4;
        }
        .diary-text {
            font-size: 15px;
            color: #e8e0e4;
            line-height: 1.6;
            margin-bottom: 8px;
        }
        .enter-link {
            text-align: right;
            font-size: 14px;
            color: #f0b8cc;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- 顶部标题 -->
    <div class="page-header">
        <span class="decor-star star-top">✦</span>
        <h1>沉没的日记本</h1>
        <span class="decor-star star-right">✦</span>
        <span class="decor-star star-bottom">✦</span>
    </div>

    <div class="main-wrap">
        <!-- 左侧侧边栏 -->
        <div class="sidebar">
            <div class="user-card">
                <div class="moon-icon">☾</div>
                <div class="user-name">西玉</div>

                <div class="data-row">

                <div class="category-item">

        </div>

        <!-- 右侧日记内容 -->
        <div class="content-area">
            <div class="content-head">
                <h2>📖 2026.8.19</h2>
                <input class="search-input" id="searchInput" placeholder="搜索日记..." type="text">
		<!-- 页码板块 右上角 -->
    		<div class="page-num">1/35</div>
            </div>

            <!-- 第一篇日记 -->
            <div class="diary-card pink-border">
                <div class="diary-date">
                    <div class="day">3</div>

                    <div class="diary-top">

                <div class="diary-main">
                    <div class="diary-top">

                    <div class="enter-link" data-url="https://zh.wikipedia.org">查看全文 →</div>

	    <!-- 第三篇日记 -->
            <div class="diary-card blue-border">
                <div class="diary-date">

                <div class="diary-main">
                    <div class="diary-top">

                    <div class="diary-text">想你了...</div>
                    <div class="enter-link" data-url="https://weibo.com">查看全文 →</div>
                </div>
            </div>

	    <!-- 第4篇日记 -->
            <div class="diary-card blue-border">
                <div class="diary-date">
                    <div class="day">24</div>

                <div class="diary-main">
                    <div class="diary-top">

                    <div class="enter-link">查看全文 →</div>
                </div>
            </div>

	    <!-- 第5篇日记 -->

                <div class="diary-date">

                <div class="diary-main">

                    <div class="diary-text">想你了...</div>
                    <div class="enter-link">查看全文 →</div>
                </div>
            </div>

	    <!-- 第6篇日记 -->
            <div class="diary-card blue-border">
                <div class="diary-date">
                    <div class="day">24</div>

                <div class="diary-main">

                </div>
            </div>
        </div>
    </div>

<script>
// 格式：'关键词':'对应网址'，逗号分隔，可自行增删
const keywordMap = {
    '日记': 'https://www.baidu.com',
    'note': 'https://www.baidu.com',
    'bing': 'https://www.bing.com',
    '微博': 'https://weibo.com',
    '维基': 'https://zh.wikipedia.org',
    '小红书': 'https://xiaohongshu.com'
};

const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('keydown', function(e) {
    if(e.key === 'Enter'){
        let inputVal = this.value.trim().toLowerCase();
        // 判断输入内容是否在映射表里
        if(keywordMap[inputVal]){
            // 读取对应网址，新标签打开
            window.open(keywordMap[inputVal], '_blank');
        }
        // 无匹配关键词，不执行任何操作
    }
})


// 修改后的查看全文逻辑：读取每个标签自己的data-url链接
const allReadBtn = document.querySelectorAll('.enter-link');
allReadBtn.forEach(item => {
    item.addEventListener('click', () => {
        // 获取当前点击元素身上存好的独立网址
        const targetLink = item.getAttribute('data-url');
        window.open(targetLink, '_blank');
    })
})
</script>
</body>
</html>
