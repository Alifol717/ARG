<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天窗口</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
        }
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #f5f5f5;
        }
        /* 聊天顶部导航 */
        .chat-top-bar {
            height: 48px;
            background: #f7f7f7;
            display: flex;
            align-items: center;
            padding: 0 12px;
            border-bottom: 1px solid #e5e5e5;
        }
        .back-btn {
            font-size: 20px;
            margin-right: 12px;
            cursor: pointer;
        }
        .chat-title-name {
            flex: 1;
            text-align: center;
            font-size: 17px;
            font-weight: 500;
        }
        /* 聊天消息区域（可滚动） */
        .msg-wrap {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            background: #f5f5f5;
        }
        /* 时间分割线样式 */
        .time-divider {
            width: 100%;
            text-align: center;
            margin: 20px 0;
            position: relative;
        }
        .time-divider span {
            display: inline-block;
            font-size: 12px;
            color: #999;
            background: #e0e0e0;
            padding: 3px 10px;
            border-radius: 4px;
        }
        /* 消息通用 */
        .msg-row {
            margin-bottom: 16px;
            display: flex;
            gap: 8px;
        }
        .msg-row.self {
            flex-direction: row-reverse;
        }
        .msg-avatar {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            flex-shrink: 0;
            overflow: hidden;
            cursor: pointer;
        }
        .msg-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .msg-text {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 15px;
            line-height: 1.5;
        }
        /* 对方消息灰色气泡 */
        .msg-row.other .msg-text {
            background: #ffffff;
        }
        /* 自己绿色气泡 */
        .msg-row.self .msg-text {
            background: #95ec69;
        }
        /* 底部输入框 */
        .input-bar {
            height: 50px;
            background: #fff;
            display: flex;
            align-items: center;
            padding: 0 12px;
            border-top: 1px solid #eee;
            gap: 10px;
        }
        .chat-input {
            flex: 1;
            height: 36px;
            border-radius: 6px;
            background: #f4f4f4;
            border: none;
            padding: 0 12px;
            font-size: 15px;
        }
        .send-btn {
            padding: 6px 14px;
            background: #07c160;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- 顶部返回栏 -->
    <div class="chat-top-bar">
        <span class="back-btn" onclick="history.back()">&lt;</span>
        <div class="chat-title-name" id="chatName"></div>
        <span>⋯</span>
    </div>

    <!-- 消息容器 -->
    <div class="msg-wrap" id="msgBox"></div>

    <!-- 底部输入 -->
    <div class="input-bar">
        <input class="chat-input" placeholder="输入消息...">
        <div class="send-btn">发送</div>
    </div>

    <script>
        // 1. 好友数据配置：名称、头像、聊天记录【改造为时间段分组】
        const friendData = {
            chenmo: {
                name: "陈默",
                avatar: "https://picsum.photos/id/64/40/40",
                // 每个timeBlock代表一个时间段，time是分割线文字，list是该时段所有消息
                records: [
                    {
                        time: "6月12日 下午16:20",
                        list: [
                            {type:"self", text:"下次见面约好了要去拼豆了"},
                            {type:"self", text:"可别忘了"},
                            {type:"other", text:"我虽然记性不好 但是可没有差到连这么重要的事都记不住！"},
                            {type:"self", text:"你不是高中的时候就因为记不住"},
                            {type:"self", text:"所以把所有密码都改成学号了吗"},
                            {type:"other", text:"谁说得 我那是嫌麻烦 不是记不住"},
                            {type:"other", text:"而且又不是所有密码都是学号"},
                            {type:"self", text:"哈哈哈哈哈哈那也差不多啦"},
                        ]
                    },
                    {
                        time: "6月29日 晚上21:05",
                        list: [
                            {type:"self", text:"想你了（QAQ）"},
                            {type:"other", text:"想你呀~（Q 3 Q）"},
                            {type:"self", text:"我俩要是在一个大学就好了，就可以像以前那样手拉手聊天了"},
                            {type:"self", text:"结果现在连省份都不是同一个"},
                            {type:"other", text:"就是啊"},
                            {type:"other", text:"只有寒暑假才能见面 完全就是异地啊"},
                            {type:"other", text:"有点怀念高中的时候了"},
                            {type:"self", text:"我也是"},
                            {type:"self", text:"什么时候放假呀"},
                            {type:"other", text:"快了快了"},
                            {type:"other", text:"最近期末周了 考完试就能回家了"},
                            {type:"other", text:"你们放假时间确定了吗"},
                            {type:"self", text:"估计和你们差不多"},
                        ]
                    },
                    {
                        time: "8月18日 晚上21:10",
                        list: [
                            {type:"self", text:"明天七夕 出去玩不"},
                            {type:"other", text:"那不是小情侣的节日吗"},
                            {type:"other", text:"咱俩单身狗凑啥热闹"},
                            {type:"self", text:"打折呀 优惠呀全吻了上来"},
                            {type:"self", text:"错过可就没有咯"},
                            {type:"other", text:"走!"},
                            {type:"other", text:"那明天老地方见"},
                            {type:"self", text:"欧坤"},
                            {type:"other", text:"明天见呀"},

                        ]
                    },
                    {
                        time: "8月19日 上午9:26",
                        list: [
                            {type:"self", text:"我在车上了"},
                            {type:"self", text:"马上就到了"},
                            {type:"self", text:"我今天来得可比你早"},
                            {type:"self", text:"难得呀"},
                            {type:"self", text:"咋还不来"},

                        ]
                    }

                ]
            },
            linxia: {
                name: "我",
                avatar: "https://picsum.photos/id/1005/40/40",
                records: [
                    {
                        time: "8月19日 上午10:13",
                        list: [
                            {type:"self", text:"陈默干啥不回我消息"},
                            {type:"self", text:"手机为啥在咖啡店"},
                            {type:"self", text:"也不回个电话"},
                            {type:"self", text:"担心ing"},

                        ]
                    }
                ]
            },
            police: {
                name: "咖啡店老板",
                avatar: "https://picsum.photos/id/1074/40/40",
                records: [
                    {
                        time: "8月18日 晚上21:13",
                        list: [
                            {type:"self", text:"老板明天靠窗雅座"},
                            {type:"self", text:"说晚了还能有不 感谢！"},
                            {type:"other", text:"当然有了"},
                            {type:"other", text:"都是老顾客了"}
                        ]
                    }
                ]
            }
        };

        // 2. 获取地址栏 uid 参数
        const urlParams = new URLSearchParams(location.search);
        const uid = urlParams.get("uid");
        const data = friendData[uid];

        // 3. 渲染页面标题、头像、聊天记录（循环时间段+渲染分割线）
        document.getElementById("chatName").innerText = data.name;
        const msgBox = document.getElementById("msgBox");
        let html = "";

        // 遍历每一个时间分组
        data.records.forEach(timeBlock => {
            // 先插入时间分割线
            html += `<div class="time-divider"><span>${timeBlock.time}</span></div>`;
            // 再遍历该时段内所有消息
            timeBlock.list.forEach(item => {
                if(item.type === "other"){
                    // 对方头像增加点击跳转个人资料页 profile.html
                    html += `
                        <div class="msg-row other">
                            <div class="msg-avatar" onclick="location.href='profile.html?uid=${uid}'">
                                <img src="${data.avatar}">
                            </div>
                            <div class="msg-text">${item.text}</div>
                        </div>
                    `;
                }else{
                    // 自己的头像无点击事件
                    html += `
                        <div class="msg-row self">
                            <div class="msg-avatar">
                                <img src="https://picsum.photos/id/237/40/40">
                            </div>
                            <div class="msg-text">${item.text}</div>
                        </div>
                    `;
                }
            });
        });

        msgBox.innerHTML = html;
        // 打开页面自动滚动到最新消息底部
        msgBox.scrollTop = msgBox.scrollHeight;
    </script>
</body>
</html>
