<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旧手机聊天记录</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{background:#f4f4f4;padding:30px;}
        /* 手机聊天框容器 */
        .phone{
            width:360px;
            margin:0 auto;
            background:#fff;
            border:1px solid #ddd;
            border-radius:14px;
            overflow:hidden;
        }
        /* 微信顶部标题栏 */
        .chat-header{
            background:#06c160;
            color:#fff;
            padding:12px 15px;
            display:flex;
            align-items:center;
        }
        .avatar{
            width:32px;height:32px;
            background:#ccc;border-radius:50%;
            margin-right:10px;
        }
        /* 聊天消息区域 */
        .msg-box{
            height:520px;
            padding:15px;
            overflow-y:auto;
        }
        .msg{margin-bottom:14px;display:flex;align-items:flex-end;}
        .msg-other{justify-content:flex-start;}
        .msg-self{justify-content:flex-end;}
        /* 消息气泡 点击可跳转 */
        .bubble{
            max-width:70%;
            padding:8px 12px;
            border-radius:18px;
            cursor:pointer;
        }
        .msg-other .bubble{background:#f0f0f0;}
        .msg-self .bubble{background:#06c160;color:#fff;}
        .time{font-size:10px;color:#999;margin:0 6px;}
        /* 异常消息抖动故障特效 */
        .glitch{animation:shake 1.2s infinite;}
        @keyframes shake{
            0%{transform:translate(0,0)}
            25%{transform:translate(-2px,2px)}
            50%{transform:translate(2px,-2px)}
            75%{transform:translate(-2px,-2px)}
            100%{transform:translate(0,0)}
        }
    </style>
</head>
<body>
    <div class="phone">
        <div class="chat-header">
            <div class="avatar"></div>
            <span>护工李姐</span>
        </div>
        <div class="msg-box">
            <!-- 对方消息：点击跳转到线索1页面 -->
            <div class="msg msg-other">
                <div class="bubble" onclick="location.href='clue1.html'">千万别打开档案室最左侧铁柜</div>
                <span class="time">01:42</span>
            </div>
            <!-- 玩家自身消息 -->
            <div class="msg msg-self">
                <span class="time">01:43</span>
                <div class="bubble">铁柜里有什么？</div>
            </div>
            <!-- 异常抖动消息：点击跳转到线索2页面 -->
            <div class="msg msg-other glitch">
                <div class="bubble" onclick="location.href='clue2.html'">档案图片内藏base64：Y2x1ZTA3Mw==</div>
                <span class="time">01:44</span>
            </div>
        </div>
    </div>
    <!-- 源码隐藏线索：最终结局页面 end.html -->
</body>
</html>
